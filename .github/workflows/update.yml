name: refresh lab notebook

on:
  schedule:
    - cron: '17 11 * * 1' # Mondays, 06:17 Bogota
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: refresh dynamic data
        run: node generate/update-now.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: re-render figure 05
        run: node generate/build.mjs --only=now

      - name: commit if changed
        run: |
          git config user.name "field-journal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate/data/now.json assets/now-light.svg assets/now-dark.svg
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: weekly lab notebook refresh"
            git push
          fi
